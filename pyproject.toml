[project]
name = "news-weaver"
version = "0.1.0"
description = "여러 소스에서 뉴스를 수집·요약하여 이메일로 전달하는 개인용 다이제스트 파이프라인"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "feedparser>=6.0.14",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_weaver"]
